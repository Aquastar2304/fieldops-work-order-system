services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldops-postgres
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: fieldops-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fieldops
      DB_USER: fieldops
      DB_PASSWORD: fieldops
      JWT_SECRET: ZmllbGRvcHMtZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LTEyMzQ1Ng==
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  report-service:
    build:
      context: ./report-service
    container_name: fieldops-report-service
    environment:
      DATABASE_URL: postgres://fieldops:fieldops@postgres:5432/fieldops?sslmode=disable
      PORT: "8081"
      DEFAULT_OVERDUE_DAYS: "7"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      # The Go service reads tables Flyway creates, so it must not start first.
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: fieldops-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
